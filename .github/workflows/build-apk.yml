name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # As chaves vêm dos "secrets" do repositório (Settings → Secrets and variables → Actions).
      - name: Criar local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Secret GEMINI_API_KEY não configurado no repositório."
            exit 1
          fi
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
          } > local.properties

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bela.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bela-apk
          path: Bela.apk
          retention-days: 30

name: Inspecionar fontes da Bíblia (temporário)

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/inspecionar-fontes-biblia.yml"]

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - name: Estrutura do texto do Gutenberg 62383
        run: |
          curl -sSL -A "Mozilla/5.0" -o pg.txt https://www.gutenberg.org/cache/epub/62383/pg62383.txt
          sha256sum pg.txt
          n=$(grep -n "INDICE DOS LIVROS" pg.txt | head -1 | cut -d: -f1)
          echo "=== depois do índice (linhas $((n+80))-$((n+260))) ==="; sed -n "$((n+80)),$((n+260))p" pg.txt | cat -A | cut -c1-110
          echo "=== Salmo 23 ==="; s=$(grep -n "^PSALMO 23\|SALMO 23\|PSALMO XXIII" pg.txt | head -3); echo "$s"
          grep -n -m 5 "O Senhor é o meu pastor" pg.txt
          l=$(grep -n -m1 "O Senhor é o meu pastor" pg.txt | cut -d: -f1); sed -n "$((l-12)),$((l+14))p" pg.txt
          echo "=== 1 Pedro 5 ==="; l=$(grep -n -m1 "cuidado de vós\.$" pg.txt | cut -d: -f1); sed -n "$((l-40)),$((l+6))p" pg.txt
          echo "=== Começo de 1 Pedro ==="; l=$(grep -n "EPISTOLA" pg.txt | grep -i pedro | head -1 | cut -d: -f1); echo "linha $l"; sed -n "$((l-4)),$((l+25))p" pg.txt
          echo "=== Linhas com notas [n] (amostra) ==="; grep -n -m 8 "^\[[0-9]*\]\|^ *\[[0-9]\+\] " pg.txt
          echo "=== Cabeçalhos de capítulo (amostra) ==="; grep -n -m 20 -E "^(CAPITULO|CAP\.|PSALMO) " pg.txt
          echo "=== Contagens ==="; grep -c -E "^CAPITULO " pg.txt || true; grep -c -E "^PSALMO " pg.txt || true
          echo "=== Fim do texto bíblico ==="; e=$(grep -n "END OF THE PROJECT GUTENBERG" pg.txt | cut -d: -f1); sed -n "$((e-120)),$((e-1))p" pg.txt | cut -c1-100
